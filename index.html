<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>erikcj</title><style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}body{font-family:Poppins,sans-serif;background:#030712;color:#fff;overflow-x:hidden}
.stars,.stars:before,.stars:after{position:fixed;inset:0;content:"";background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(1.5px 1.5px at 150px 90px,#fff,transparent),radial-gradient(2px 2px at 280px 180px,#fff,transparent),radial-gradient(1px 1px at 420px 60px,#fff,transparent);background-size:500px 300px;animation:drift 60s linear infinite;z-index:-3;opacity:.7}.stars:before{animation-duration:90s;opacity:.4}.stars:after{animation-duration:120s;opacity:.2}@keyframes drift{from{transform:translateY(0)}to{transform:translateY(300px)}}
.glass{background:rgba(255,255,255,.08);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.12);box-shadow:0 8px 30px rgba(0,0,0,.35)}
header{position:sticky;top:20px;margin:20px auto;width:90%;max-width:1200px;border-radius:20px;padding:20px 40px;display:flex;justify-content:space-between;align-items:center}
header h1{letter-spacing:5px}nav a{color:#fff;text-decoration:none;margin-left:24px}nav a:hover{color:#7cc7ff}
.hero{min-height:85vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:40px}
.hero h2{font-size:4rem}.hero p{margin:20px;color:#cfcfcf}
video{width:70%;max-width:850px;border-radius:20px;box-shadow:0 0 40px rgba(0,0,0,.6)}
.contact{padding:100px 20px;text-align:center}.card{max-width:520px;margin:auto;padding:35px;border-radius:24px}.card a{color:#fff;text-decoration:none}.card a:hover{color:#7cc7ff}
@media(max-width:900px){header{flex-direction:column}nav{margin-top:15px}.hero h2{font-size:2.6rem}video{width:95%}}
</style></head><body>
<div class="stars"></div>
