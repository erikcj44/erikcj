<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>erikcj</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Poppins,sans-serif;background:#050505;color:#fff;overflow-x:hidden}
.background{position:fixed;inset:0;background:radial-gradient(circle at top,#2b2b2b 0%,transparent 45%),linear-gradient(#050505,#000);z-index:-2}
header{display:flex;justify-content:space-between;align-items:center;padding:30px 8%}
header h1{font-size:2.8rem;letter-spacing:5px}
nav a{color:#fff;text-decoration:none;margin-left:30px;transition:.3s}
nav a:hover{color:#6ab7ff}
.hero{min-height:85vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:40px}
.hero h2{font-size:4rem;margin-bottom:20px}
.hero p{color:#bfbfbf;max-width:700px;margin-bottom:40px;font-size:1.1rem}
video{width:70%;max-width:850px;border-radius:20px;box-shadow:0 0 40px rgba(0,0,0,.7),0 0 70px rgba(0,140,255,.25);transition:.4s}
video:hover{transform:scale(1.02)}
@media(max-width:900px){.hero h2{font-size:2.7rem}video{width:95%}header{flex-direction:column}nav{margin-top:20px}nav a{margin:0 10px}}
</style>
</head>
<body>
<div class="background"></div>
<header><h1>erikcj</h1><nav><a href="#">Home</a><a href="#">Videos</a><a href="#">Projects</a><a href="#">Contact</a></nav></header>
<section class="hero">
<h2>Create. Edit. Inspire.</h2>
<p>Welcome to my portfolio. Watch my latest featured project below.</p>
<video autoplay muted loop controls>
<source src="promo.mp4" type="video/mp4">
</video>
</section>
</body></html>
