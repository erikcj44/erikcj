*{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}body{font-family:Poppins,sans-serif;background:#080808;color:#fff;overflow-x:hidden}

footer{padding:40px;text-align:center;color:#777;border-top:1px solid rgba(255,255,255,.06);margin-top:70px}
